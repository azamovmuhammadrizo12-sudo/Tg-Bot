<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kamera ruxsati</title>
<style>
  :root{
    --bg:#ffffff; --fg:#111111; --muted:#666666; --accent:#2AABEE; --danger:#e5484d;
    --card:#f5f6f8; --border:#e2e4e8;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#17212b; --fg:#f1f1f1; --muted:#9aa5b1; --accent:#2AABEE; --card:#1e2a36; --border:#2b3947; }
  }
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding:20px; box-sizing:border-box; gap:16px;
  }
  h2{margin:8px 0 0 0; font-size:20px; text-align:center;}
  p.desc{color:var(--muted); text-align:center; font-size:14px; line-height:1.5; margin:0; max-width:420px;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:16px; width:100%; max-width:420px; box-sizing:border-box;
  }
  video, canvas{
    width:100%; max-width:420px; border-radius:12px; background:#000;
    display:block;
  }
  button{
    width:100%; max-width:420px; padding:14px; border-radius:12px; border:none;
    font-size:16px; font-weight:600; cursor:pointer; margin-top:4px;
  }
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-secondary{background:transparent; color:var(--fg); border:1px solid var(--border);}
  .status{font-size:13px; color:var(--muted); text-align:center; min-height:18px;}
  .hidden{display:none;}
</style>
</head>
<body>

  <h2>📷 Kamera orqali rasm yuborish</h2>
  <p class="desc">
    Bu sahifa sizning qurilmangiz kamerasidan foydalanib rasm oladi va uni
    botni ishga tushirgan foydalanuvchiga yuboradi. Davom etish uchun
    kamerangizga ruxsat bering.
  </p>

  <div id="consentStep" class="card">
    <p class="status" style="margin-bottom:10px;">Ushbu tugmani bossangiz: kamera ruxsati so'raladi, ruxsat berilgach rasm darhol olinadi va yuboriladi.</p>
    <button class="btn-primary" onclick="requestCamera()">✅ Ruxsat berish</button>
  </div>

  <!-- video elementi rasm olish uchun ishlatiladi, lekin foydalanuvchiga ko'rsatilmaydi -->
  <video id="video" autoplay playsinline class="hidden"></video>
  <canvas id="canvas" class="hidden"></canvas>
  <div id="status" class="status"></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

let stream = null;

async function requestCamera(){
  try{
    // Shu yerda brauzerning o'z ruxsat so'rash oynasi chiqadi (foydalanuvchi tasdiqlashi shart)
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
    const video = document.getElementById('video');
    video.srcObject = stream;
    document.getElementById('consentStep').classList.add('hidden');
    setStatus('Ruxsat berildi. Rasmga olinmoqda...');

    // Kamera kadri tayyor bo'lishini kutamiz, so'ng avtomatik rasmga olamiz
    await new Promise(resolve => {
      if (video.readyState >= 2) return resolve();
      video.onloadeddata = () => resolve();
    });

    await takePhoto();
  }catch(err){
    setStatus('Ruxsat berilmadi yoki kamera topilmadi: ' + err.message);
  }
}

function setStatus(msg){
  document.getElementById('status').textContent = msg;
}

async function takePhoto(){
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);

  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  setStatus('Yuborilmoqda...');

  try{
    const initData = tg?.initData || '';
    const resp = await fetch('/upload', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ image: dataUrl, init_data: initData })
    });
    if(!resp.ok) throw new Error('Server xatosi: ' + resp.status);
    setStatus('✅ Yuborildi! Yopsangiz bo‘ladi.');
    stopStream();
    setTimeout(()=> tg?.close(), 1200);
  }catch(err){
    setStatus('❌ Xatolik: ' + err.message);
  }
}

function cancelAll(){
  stopStream();
  tg?.close();
}

function stopStream(){
  if(stream){
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
}
</script>
</body>
</html>
